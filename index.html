<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ColumMaster Pro - Diseñador Estructural de Columnas</title>
    <meta name="description" content="Diseño y verificación estructural de columnas de hormigón armado, acero y madera según ACI 318, Eurocódigos y Normas Cubanas (NC). Diagramas de interacción P-M, generador de combinaciones de carga D+L con ejemplos de viviendas económicas, simulador de falla, análisis de confiabilidad Monte Carlo con histograma Recharts, comparativas de normas y asistente de optimización de secciones." />
    <meta property="og:title" content="ColumMaster Pro - Diseñador Estructural de Columnas" />
    <meta property="og:description" content="Diseño y verificación estructural de columnas de hormigón armado, acero y madera según ACI 318, Eurocódigos y Normas Cubanas (NC). Diagramas de interacción P-M, generador de combinaciones de carga D+L con ejemplos de viviendas económicas, simulador de falla, análisis de confiabilidad Monte Carlo con histograma Recharts, comparativas de normas y asistente de optimización de secciones." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ColumMaster" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      (() => {
        const isViteNoise = (...args) => {
          try {
            return args.some((arg) => {
              if (!arg) return false;
              const str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg) || '');
              return str.includes('[vite]') || str.includes('WebSocket') || str.includes('websocket');
            });
          } catch {
            return false;
          }
        };

        ['error', 'warn', 'info', 'log', 'debug'].forEach((method) => {
          const original = console[method];
          if (typeof original === 'function') {
            console[method] = function (...args) {
              if (isViteNoise(...args)) {
                return;
              }
              original.apply(console, args);
            };
          }
        });

        window.addEventListener('error', (event) => {
          const msg = event?.message || event?.error?.message || String(event);
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket')) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event?.reason;
          const msg = typeof reason === 'string' ? reason : (reason?.message || reason?.stack || String(reason) || '');
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket')) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
