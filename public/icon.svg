<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="colGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>
  <!-- Column body / capital -->
  <rect x="120" y="70" width="272" height="32" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="3" />
  <rect x="144" y="102" width="224" height="24" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />
  <!-- Column shaft -->
  <rect x="168" y="126" width="176" height="260" fill="url(#colGrad)" opacity="0.85" rx="4" />
  <!-- Rebar bars (Concrete) / Flanges (Steel) -->
  <line x1="196" y1="126" x2="196" y2="386" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="126" x2="256" y2="386" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="316" y1="126" x2="316" y2="386" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <!-- Stirrups / Cercos ties -->
  <line x1="184" y1="160" x2="328" y2="160" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="184" y1="210" x2="328" y2="210" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="184" y1="260" x2="328" y2="260" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="184" y1="310" x2="328" y2="310" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="184" y1="360" x2="328" y2="360" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6 4" />
  <!-- Base plate & bolts -->
  <rect x="144" y="386" width="224" height="24" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />
  <rect x="104" y="410" width="304" height="38" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="3" />
  <!-- Anchor bolts -->
  <circle cx="134" cy="429" r="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
  <circle cx="378" cy="429" r="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
  <!-- Moment symbol -->
  <path d="M 390 220 A 45 45 0 0 1 390 290" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <polygon points="380,285 395,302 400,280" fill="#38bdf8" />
  <!-- Axial load arrow -->
  <line x1="256" y1="20" x2="256" y2="66" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
  <polygon points="244,56 256,76 268,56" fill="#ef4444" />
</svg>
